[project]
name = "certgenerator"
version = "0.2.6"
description = ""
readme = "README.md"
authors = [
    {name = "Vishnu Ram", email = "vishnu@astronomer.io"},
]

requires-python = ">=3.11"
dependencies = [
    "cachetools",
    "certifi",
    "charset-normalizer",
    "click",
    "idna",
    "kubernetes",
    "pyasn1",
    "pyasn1-modules",
    "python-dateutil",
    "PyYAML",
    "requests",
    "requests-oauthlib",
    "rsa",
    "six",
    "urllib3",
    "websocket-client",
]

[project.scripts]
certgenerator = "certgenerator:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
certifi  = "2026-10-23T00:00:00Z"
conda    = "2026-10-23T00:00:00Z"
grpcio   = "2026-10-23T00:00:00Z"
pip      = "2026-10-23T00:00:00Z"
sigstore = "2026-10-23T00:00:00Z"
uv       = "2026-10-23T00:00:00Z"
